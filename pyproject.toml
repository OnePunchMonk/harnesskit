[project]
name = "harnesskit"
version = "0.1.0"
description = "Infrastructure for building, linting, and evaluating agent harnesses"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
pydantic-ai = ["pydantic-ai>=2.0"]

[project.scripts]
harness = "harnesskit.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harnesskit"]
