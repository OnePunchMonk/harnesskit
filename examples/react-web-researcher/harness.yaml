schema_version: 1
metadata:
  name: react-web-researcher
  version: 0.1.0
  author: pythonslacks
  description: ReAct loop with web search, stops when it emits <answer>...</answer>

model:
  provider: anthropic
  model_id: claude-sonnet-5
  temperature: 0.0

loop:
  type: react
  max_turns: 12

tools:
  - name: search
    source: custom
    ref: tools/search.json
    permissions: []
  - name: verify_citation
    source: custom
    ref: tools/verify_citation.json
    permissions: []

guardrails:
  - name: cost-ceiling
    trigger: on_budget_check
    check: "cost_threshold:0.50"
    enforce: abort
  - name: dedup
    trigger: pre_tool_call
    check: dedup_detection
    enforce: retry_with_reflection

memory:
  session: in_memory

context:
  budget_tokens: 60000
  compaction: observation_masking

termination:
  - type: tag_emitted
    value: answer
  - type: max_turns
    value: 12

eval:
  cases:
    - id: capital-lookup
      input: "What is the capital of the country with the largest population in South America?"
      expected_tools: ["search"]
      expected_output_contains: ["Brasília"]
      max_turns: 6
      scoring_mode: exact_match

scaffold:
  system_prompt: system_prompt.md
  system_prompt_is_file: true
  template_vars: ["task"]
